<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Bash</title>
</head>
<body>

    <header>
        <h1>Welcome to the Birthday Bash</h1>
    </header>

    <main>
        <h2>Flight Lookup</h2>
        <div class="modal" id="flightModal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Flight Information</h2>
                <div id="flightResults"></div>
            </div>
        </div>

        <form id="flightForm">
            <div class="input-group">
                <label for="departure">Departure:</label>
                <input type="text" id="departure" name="departure">
            </div>
            <div class="input-group">
                <label for="arrival">Arrival:</label>
                <input type="text" id="arrival" name="arrival">
            </div>
            <button type="button" class="btn flight-button" onclick="lookupFlights()">Lookup Flights</button>
        </form>

        <h2>Transportation</h2>
        <div class="transport-inputs">
            <div class="input-group">
                <label for="transportType">Transport Type:</label>
                <select id="transportType" name="transportType">
                    <option value="taxi">Taxi</option>
                    <option value="bus">Bus</option>
                </select>
            </div>
            <div class="input-group">
                <label for="duration">Duration:</label>
                <input type="text" id="duration" name="duration">
            </div>
            <button type="button" class="btn transport-button" onclick="addTransport()">Add Transport</button>
        </div>

        <h2>RSVP</h2>
        <form id="rsvpForm">
            <div class="input-group">
                <label for="guestName">Guest Name:</label>
                <input type="text" id="guestName" name="guestName">
            </div>
            <button type="submit" class="btn rsvp-button">Submit</button>
        </form>
    </main>

    <script>
        function lookupFlights() {
            // Consolidated flight lookup logic
        }
        function addTransport() {
            // Logic for adding transport
        }
        // Close modal event handler
        document.querySelector('.close').onclick = function() {
            document.getElementById('flightModal').style.display = 'none';
        };
    </script>
</body>
</html>
