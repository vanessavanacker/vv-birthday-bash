const code = new TextDecoder('utf-8').decode(Uint8Array.from(atob(B64), c => c.charCodeAt(0)));
const box = document.getElementById('code-box');
box.value = code;

async function copyCode(){
  const btn = document.getElementById('copy-btn');
  const toast = document.getElementById('toast');
  let ok = false;
  if(navigator.clipboard && window.isSecureContext){
    try { await navigator.clipboard.writeText(code); ok = true; } catch(e){}
  }
  if(!ok){
    box.select(); box.setSelectionRange(0, code.length);
    try { ok = document.execCommand('copy'); } catch(e){}
  }
  if(ok){
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    toast.classList.add('show');
    setTimeout(() => {
      btn.textContent = '📋 Select all & copy';
      btn.classList.remove('copied');
      toast.classList.remove('show');
    }, 2400);
  } else {
    btn.textContent = '⚠️ Tap the box below, then long-press → Copy';
  }
}
</script>
